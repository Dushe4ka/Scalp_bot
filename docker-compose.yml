services:
  redis:
    image: redis:7-alpine
    container_name: scalp-bot-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:14571:6379"
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--requirepass",
        "Ollama12357985"
      ]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "Ollama12357985", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  redis_data:
